<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AI-SlowMatch — Rendezvous Demo</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2733; --muted: #5b6b7b;
    --accent: #2f6f5e; --accent-ink: #ffffff; --line: #dde3ea;
    --warn-bg: #fdf6ec; --warn-line: #e7c98a; --bad: #a03434; --good: #2f6f5e;
    --chip: #eef2f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --card: #1d232b; --ink: #e8edf2; --muted: #9aa8b5;
      --accent: #58a08c; --accent-ink: #10141a; --line: #313a45;
      --warn-bg: #2a2415; --warn-line: #6d5a2c; --bad: #d98383; --good: #7cc0ab;
      --chip: #26303a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 4px; }
  h1 { font-size: 1.35rem; margin: 0; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .tagline { color: var(--muted); font-size: .92rem; margin: 0 0 14px; }
  .lang-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: .9rem;
  }
  section.card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin: 14px 0;
  }
  section.card.locked { opacity: .55; pointer-events: none; }
  .step-tag {
    display: inline-block; background: var(--chip); color: var(--accent);
    font-size: .78rem; font-weight: 600; border-radius: 6px; padding: 2px 8px; margin-bottom: 6px;
  }
  label { display: block; font-size: .88rem; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea { min-height: 72px; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 140px; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--ink); }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  button.ghost {
    background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; margin-top: 8px;
  }
  button.small { padding: 5px 12px; font-size: .85rem; margin: 0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .notice {
    background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px;
    padding: 10px 14px; font-size: .88rem; margin: 10px 0;
  }
  .fine { color: var(--muted); font-size: .82rem; margin: 6px 0 0; }
  .error-box { color: var(--bad); font-size: .9rem; margin-top: 10px; white-space: pre-wrap; }
  .ok-box { color: var(--good); font-size: .9rem; margin-top: 10px; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: .8rem; word-break: break-all; }
  .candidate, .intro-entry {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .badge { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: .78rem; }
  .badge.matched { color: var(--good); font-weight: 600; }
  .badge.declined { color: var(--bad); }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .compare-grid .col { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .compare-grid h4 { margin: 0 0 6px; font-size: .9rem; }
  ul.plain { margin: 6px 0; padding-left: 20px; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 30px; }
  details summary { cursor: pointer; color: var(--accent); font-size: .9rem; margin-top: 8px; }
  .hidden { display: none !important; }
  @media (max-width: 560px) { .compare-grid { grid-template-columns: 1fr; } }

  /* ------- app shell ------- */
  nav.tabs {
    display: flex; gap: 4px; margin: 10px 0 4px; border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  nav.tabs button {
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-weight: 600; padding: 8px 14px; cursor: pointer;
    white-space: nowrap;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view { display: none; }
  .view.active { display: block; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 560px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .dash-card h3 { margin: 0; font-size: .95rem; }
  .dash-card .status { font-size: .85rem; color: var(--muted); flex: 1; }
  .dash-card .status.good { color: var(--good); }
  .settings-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .settings-tabs button {
    background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); font: inherit; padding: 6px 14px; cursor: pointer;
  }
  .settings-tabs button.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  /* ------- chat ------- */
  #chatLog {
    display: flex; flex-direction: column; gap: 10px; min-height: 200px; max-height: 46vh;
    overflow-y: auto; padding: 4px 2px; margin: 10px 0;
  }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; font-size: .93rem; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--chip); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: .8rem; background: transparent; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .chips button {
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); font: inherit; font-size: .82rem; padding: 5px 12px; cursor: pointer;
  }
  .chat-input { display: flex; gap: 8px; align-items: flex-end; }
  .chat-input textarea { flex: 1; min-height: 46px; }
  .file-list { font-size: .82rem; color: var(--muted); margin: 6px 0; }
  /* Styled markdown rendering for self-model portrait + plan (no more raw text walls) */
  .mdview { font-size:.93rem; line-height:1.65; max-height:52vh; overflow-y:auto; }
  .mdview h1 { font-size:1.15rem; margin:.4rem 0 .6rem; }
  .mdview h2 { font-size:1rem; margin:1rem 0 .4rem; color:var(--accent);
               border-bottom:1px solid var(--line); padding-bottom:.2rem; }
  .mdview h3 { font-size:.95rem; margin:.8rem 0 .3rem; }
  .mdview blockquote { margin:.6rem 0; padding:.5rem .8rem;
                       border-left:3px solid var(--accent); background:var(--chip);
                       border-radius:0 8px 8px 0; color:var(--muted); }
  .mdview ul { margin:.3rem 0 .6rem 1.2rem; padding:0; }
  .mdview li { margin:.25rem 0; }
  .mdview p { margin:.45rem 0; }
  .mdview code { background:var(--chip); border-radius:4px; padding:0 .3em; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">中文</button>
  </header>

  <nav class="tabs" id="mainNav">
    <button data-view="home" onclick="showView('home')" data-i18n="navHome"></button>
    <button data-view="chat" onclick="showView('chat')" data-i18n="navChat"></button>
    <button data-view="matching" onclick="showView('matching')" data-i18n="navMatching"></button>
    <button data-view="settings" onclick="showView('settings')" data-i18n="navSettings"></button>
  </nav>

  <!-- First-run setup (everything skippable; AI & data live in Settings) -->
  <section class="card hidden" id="setupWizard">
    <span class="step-tag" data-i18n="wizardTag"></span>
    <h2 data-i18n="wizardTitle"></h2>
    <p class="fine" data-i18n="tagline"></p>
    <div class="notice" data-i18n-html="privacyNotice"></div>
    <button class="primary" onclick="finishSetup('settings','ai')" data-i18n="wizardAI"></button>
    <button class="ghost" onclick="finishSetup('settings','data')" data-i18n="wizardData"></button>
    <button class="ghost" onclick="finishSetup('home')" data-i18n="wizardSkip"></button>
  </section>

  <!-- HOME: your AI report (the self-model), onboarding prompts, matching widget -->
  <div class="view" id="view-home">
    <div class="notice hidden" id="notLocalNotice" data-i18n-html="notLocalClient"></div>

    <!-- First-open prompts: shown only while the corresponding piece is missing -->
    <div class="dash-grid" id="homePrompts">
      <div class="dash-card hidden" id="promptAI">
        <h3 data-i18n="dashAI"></h3>
        <div class="status" data-i18n="dashNotConnected"></div>
        <button class="ghost small" onclick="showView('settings','ai')" data-i18n="dashAIBtn"></button>
      </div>
      <div class="dash-card hidden" id="promptData">
        <h3 data-i18n="dashData"></h3>
        <div class="status" data-i18n="promptDataHint"></div>
        <button class="ghost small" onclick="showView('settings','data')" data-i18n="dashDataBtn"></button>
      </div>
      <div class="dash-card hidden" id="promptChat">
        <h3 data-i18n="dashChat"></h3>
        <div class="status" data-i18n="dashChatHint"></div>
        <button class="ghost small" onclick="showView('chat')" data-i18n="dashChatBtn"></button>
      </div>
    </div>

    <!-- Deep analysis: the Chat-Analysis Module's social self-portrait -->
    <section class="card hidden" id="deepReportCard">
      <span class="step-tag" data-i18n="deepTag"></span>
      <h2 data-i18n="deepTitle"></h2>
      <p class="fine" id="deepMeta"></p>
      <div id="deepReportBox" class="mdview"></div>
      <button class="ghost small" id="deepRunBtn2" onclick="runDeepAnalysis()" data-i18n="deepUpdate"></button>
      <div id="deepMsg"></div>
    </section>

    <!-- The self-model card summary (what matching attests) -->
    <section class="card hidden" id="reportCard">
      <span class="step-tag" data-i18n="reportTag"></span>
      <h2 data-i18n="reportTitle"></h2>
      <p class="fine" data-i18n="reportIntro"></p>
      <div id="reportBox"></div>
      <p class="fine mono" id="reportMeta"></p>
      <button class="primary" onclick="showView('chat')" data-i18n="reportRefine"></button>
      <button class="ghost" id="regenBtn" onclick="generateModel()" data-i18n="analyzeBtn"></button>
      <button class="ghost" id="deepRunBtn" onclick="runDeepAnalysis()" data-i18n="deepRun"></button>
      <div id="generateMsg"></div>
    </section>
    <section class="card hidden" id="noReportCard">
      <h2 data-i18n="noReportTitle"></h2>
      <p class="fine" data-i18n="noReportIntro"></p>
      <button class="primary" onclick="showView('chat')" data-i18n="dashChatBtn"></button>
      <button class="ghost" id="genFromDataBtn" onclick="generateModel()" data-i18n="analyzeBtn"></button>
      <div id="generateMsg2"></div>
    </section>

    <!-- Matching mini-widget -->
    <section class="card" id="matchWidget">
      <h2 data-i18n="dashMatch"></h2>
      <div class="status" id="dashMatchStatus"></div>
      <div class="file-list" id="matchWidgetLog"></div>
      <button class="ghost small" onclick="showView('matching')" data-i18n="dashMatchBtn"></button>
    </section>

    <div class="notice" data-i18n-html="scamReminder" style="margin-top:14px"></div>
  </div>

  <!-- CHAT: understand yourself with your own AI -->
  <div class="view" id="view-chat">
    <section class="card">
      <h2 data-i18n="chatTitle"></h2>
      <p class="fine" data-i18n="chatIntro"></p>
      <p class="fine" id="chatBackendLine"></p>
      <div class="notice" id="chatDataReminder" data-i18n-html="chatDataReminder"></div>
      <div class="chips">
        <button onclick="useTemplate(0)" data-i18n="tpl0"></button>
        <button onclick="useTemplate(1)" data-i18n="tpl1"></button>
        <button onclick="useTemplate(2)" data-i18n="tpl2"></button>
        <button onclick="useTemplate(3)" data-i18n="tpl3"></button>
      </div>
      <div id="chatLog"></div>
      <div class="chat-input">
        <textarea id="chatInput" data-i18n-ph="chatPh"></textarea>
        <button class="ghost small hidden" id="micBtn" onclick="toggleMic()" title="voice input" style="margin:0">🎤</button>
        <button class="primary" id="chatSendBtn" onclick="sendChat()" data-i18n="chatSend"></button>
        <label class="fine" style="white-space:nowrap">
          <input type="checkbox" id="coachMode"> <span data-i18n="coachModeLabel"></span>
        </label>
      </div>
      <button class="ghost small" onclick="refineFromChat()" data-i18n="refineBtn" style="margin-top:10px"></button>
      <button class="ghost small" onclick="clearChat()" data-i18n="chatClear" style="margin-top:10px"></button>
      <div id="chatMsg"></div>
    </section>
  </div>

  <!-- SETTINGS -->
  <div class="view" id="view-settings">
    <div class="settings-tabs">
      <button id="stabBtn-ai" onclick="showSettingsTab('ai')" data-i18n="tabAI"></button>
      <button id="stabBtn-data" onclick="showSettingsTab('data')" data-i18n="tabData"></button>
      <button id="stabBtn-matching" onclick="showSettingsTab('matching')" data-i18n="tabMatching"></button>
    </div>
    <div id="stab-ai">
  <!-- Settings > AI (local client only) -->
  <section class="card" id="stepAI">
    <h2 data-i18n="step1Title"></h2>
    <p class="fine" data-i18n="aiIntro"></p>

    <div class="row" id="aiControls">
      <div>
        <label data-i18n="aiBackendLabel"></label>
        <select id="aiBackend" onchange="onBackendChange()">
          <option value="ollama" data-i18n="backendOllama" selected></option>
          <option value="claude" data-i18n="backendClaude"></option>
          <option value="codex" data-i18n="backendCodex" disabled></option>
          <option value="gemini" data-i18n="backendGemini" disabled></option>
          <option value="anthropic" data-i18n="backendAnthropic"></option>
          <option value="openai_compat" data-i18n="backendOpenAICompat"></option>
        </select>
      </div>
      <div id="aiBaseUrlWrap">
        <label data-i18n="baseUrlLabel"></label>
        <input type="text" id="aiBaseUrl" value="http://localhost:11434">
      </div>
      <div>
        <label data-i18n="modelLabel"></label>
        <select id="aiModelSel" onchange="onModelSelChange()"></select>
        <input type="text" id="aiModel" placeholder="llama3.2" class="hidden">
      </div>
      <div id="aiKeyWrap" class="hidden">
        <label data-i18n="apiKeyLabel"></label>
        <input type="password" id="aiKey" autocomplete="off">
      </div>
    </div>
    <p class="fine" data-i18n="apiKeyFine"></p>
    <button class="primary" onclick="testAI()" data-i18n="testConnect"></button>
    <div id="aiMsg"></div>
  </section>

    </div>
    <div id="stab-data" class="hidden">
      <!-- Settings > Your data (all local; skippable) -->
      <section class="card">
        <h2 data-i18n="step2Title"></h2>
        <p class="fine" data-i18n="step2Intro"></p>

        <label data-i18n="vaultLabel"></label>
        <div class="row">
          <div style="flex:3"><input type="text" id="vaultDir" data-i18n-ph="vaultPh"></div>
          <div style="flex:1"><button class="ghost small" onclick="applyVault()" data-i18n="vaultApply" style="margin-top:0"></button></div>
        </div>
        <p class="fine" data-i18n="vaultFine"></p>
        <div id="vaultMsg"></div>

        <label data-i18n="dataDirLabel"></label>
        <div class="row">
          <div style="flex:3"><input type="text" id="dataDir" data-i18n-ph="dataDirPh"></div>
          <div style="flex:1"><button class="ghost small" onclick="applyDataDir()" data-i18n="dataDirApply" style="margin-top:0"></button></div>
        </div>
        <p class="fine" data-i18n="dataDirFine"></p>
        <div class="file-list" id="dataFileList"></div>

        <label data-i18n="importFilesLabel"></label>
        <input type="file" id="dataFiles" accept=".json,.txt,.md" multiple onchange="importSourceFile(event)" style="margin-top:6px; font-size:.85rem">
        <label data-i18n="importZipLabel"></label>
        <input type="file" id="chatgptZip" accept=".zip,.json" onchange="importChatGPTZip(event)" style="margin-top:6px; font-size:.85rem">
        <label data-i18n="sourceLabel"></label>
        <textarea id="sourceNotes" data-i18n-ph="sourcePh" oninput="updateSourceCount()"></textarea>
        <p class="fine" id="sourceCount"></p>
        <p class="fine" data-i18n="sourceFine"></p>
        <button class="primary" onclick="saveNotes()" data-i18n="saveNotesBtn"></button>
        <button class="ghost small" onclick="copyDistillPrompt()" data-i18n="copyDistill"></button>
        <div id="analyzeMsg"></div>
      </section>
    </div>
    <div id="stab-matching" class="hidden">
      <!-- Settings > Matching: identity & node; shown as a prompt on first use -->
      <section class="card">
        <h2 data-i18n="matchSetupTitle"></h2>
        <p class="fine" data-i18n="matchSetupIntro"></p>

        <label data-i18n="pseudonymLabel"></label>
        <input type="text" id="pseudonym" maxlength="40" autocomplete="off" data-i18n-ph="pseudonymPh" onchange="saveIdentity()">

        <label data-i18n="contactLabel"></label>
        <input type="text" id="contact" maxlength="120" autocomplete="off" onchange="saveIdentity()">
        <p class="fine" data-i18n="contactFine"></p>

        <details>
          <summary data-i18n="manualLocation"></summary>
          <div class="row">
            <div><label data-i18n="latitude"></label><input type="number" id="lat" step="any" placeholder="31.23"></div>
            <div><label data-i18n="longitude"></label><input type="number" id="lon" step="any" placeholder="121.47"></div>
          </div>
          <button class="ghost small" onclick="useManualLocation()" data-i18n="computeBucket"></button>
        </details>
        <p class="fine" id="bucketDisplay"></p>

        <details>
          <summary data-i18n="nodeUrlLabel"></summary>
          <input type="text" id="nodeUrl" placeholder="https://your-node.example.org" onchange="setNodeUrl()">
          <p class="fine" data-i18n="nodeUrlFine"></p>
        </details>

        <div class="checks" style="margin-top:12px">
          <label><input type="checkbox" id="consent" onchange="saveIdentity()"> <span data-i18n="consentLabel"></span></label>
        </div>
        <div id="identityMsg"></div>
      </section>
    </div>
  </div>

  <!-- MATCHING: preferences + automated matching + live log -->
  <div class="view" id="view-matching">
  <!-- Relationship coach: plan + practice for users with no experience -->
  <section class="card hidden" id="coachCard">
    <span class="step-tag" data-i18n="coachTag"></span>
    <h2 data-i18n="coachTitle"></h2>
    <p class="fine" data-i18n="coachIntro"></p>
    <p class="fine mono" id="coachSkillLine"></p>
    <div id="planBox" class="mdview hidden" style="max-height:44vh"></div>
    <button class="primary" onclick="generatePlan()" data-i18n="planBtn"></button>
    <button class="ghost" onclick="showView('chat'); document.getElementById('coachMode').checked = true;"
            data-i18n="coachChatBtn"></button>
    <div style="margin-top:.8rem">
      <label data-i18n="outreachLabel"></label>
      <select id="outreachPlatform">
        <option value="Xiaohongshu">小红书 Xiaohongshu</option>
        <option value="Facebook">Facebook</option>
        <option value="WeChat Moments">微信朋友圈 WeChat Moments</option>
        <option value="a dating app">Dating app / 交友软件</option>
      </select>
      <button class="ghost" onclick="draftOutreach()" data-i18n="outreachBtn"></button>
    </div>
    <div id="outreachBox" class="hidden"
         style="white-space:pre-wrap; font-size:.9rem; max-height:36vh; overflow-y:auto"></div>
    <div style="margin-top:.8rem">
      <label data-i18n="simLabel"></label>
      <textarea id="simCard" rows="3" data-i18n-ph="simPh"></textarea>
      <button class="ghost" onclick="runSimulation()" data-i18n="simBtn"></button>
    </div>
    <div id="simBox" class="hidden"
         style="white-space:pre-wrap; font-size:.9rem; max-height:40vh; overflow-y:auto"></div>
    <div id="coachMsg"></div>
  </section>

  <section class="card" id="matchPrefs">
    <h2 data-i18n="matchPrefsTitle"></h2>
    <p class="fine" data-i18n="matchPrefsIntro"></p>
    <div class="notice hidden" id="matchSetupHint" data-i18n-html="matchSetupHint"></div>
    <div class="notice hidden" id="matchModelHint" data-i18n-html="matchModelHint"></div>

    <div class="row">
      <div>
        <label data-i18n="iAmLabel"></label>
        <select id="gender">
          <option value="" data-i18n="preferNot"></option>
          <option value="woman" data-i18n="woman"></option>
          <option value="man" data-i18n="man"></option>
          <option value="nonbinary" data-i18n="nonbinary"></option>
        </select>
      </div>
      <div>
        <label data-i18n="ageLabel"></label>
        <input type="number" id="age" min="18" max="120" required placeholder="—">
      </div>
      <div>
        <label data-i18n="distanceLabel"></label>
        <select id="distanceSel">
          <option value="4" data-i18n="distMetro"></option>
          <option value="3" data-i18n="distCity"></option>
        </select>
      </div>
    </div>

    <label data-i18n="seekingLabel"></label>
    <div class="checks">

let lang = localStorage.getItem("slowmatch_lang")
  || (navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");

function t(key) { return I18N[lang][key] !== undefined ? I18N[lang][key] : key; }

function applyI18n() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  for (const [value, key] of [["", "modelDefaultOpt"], ["__custom__", "modelCustomOpt"]]) {
    const option = document.querySelector('#aiModelSel option[value="' + value + '"]');
    if (option) option.textContent = t(key);
  }
  renderBucket();
  if (state.registered) renderInbox(state.lastInbox || []);
  renderLog();
  renderReport();
  if (state.aiName) setMsg("aiMsg", "✔ " + t("chatUsing") + " " + state.aiName, true);
}

function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  localStorage.setItem("slowmatch_lang", lang);
  applyI18n();
  renderDeepReport();  // re-render the portrait in the newly selected language
}

/* Shared compatibility-card structure: mirrors reports/local_artifacts.py.
   Structural checks cannot establish truth, consent, or safe advice. */
function validateCompatibilityCard(card) {
  const invalid = () => { throw new Error(
    "This card is incomplete or uses an unsupported format. Review and regenerate it before sharing. / 此卡片不完整或格式不受支持；分享前请审核并重新生成。"
  ); };
  const object = value => value !== null && typeof value === "object" && !Array.isArray(value);
  const exact = (value, keys) => object(value) && Object.keys(value).length === keys.length
    && keys.every(key => Object.prototype.hasOwnProperty.call(value, key));
  const text = (value, limit) => typeof value === "string" && /\S/u.test(value)
    && [...value].length <= limit && ![...value].some(char => {
      const code = char.codePointAt(0); return code >= 0xd800 && code <= 0xdfff;
    });
  if (!exact(card, ["schema_version", "tier2_summary", "source"])
      || card.schema_version !== "0.1"
      || card.source !== "self_model_from_ai_analysis_of_own_data") invalid();
  const summary = card.tier2_summary;
  const prose = ["life_goals", "communication_style", "boundaries", "uncertainty_notes", "evidence_notes"];
  if (!exact(summary, ["values", ...prose]) || !Array.isArray(summary.values)
      || summary.values.length < 1 || summary.values.length > 20
      || !summary.values.every(value => text(value, 1000))
      || !prose.every(key => text(summary[key], 8000))) invalid();
  return card;
}
/* End compatibility-card structure. */

function cardKey(p) { return "slowmatch_card::" + p; }
function readCardKey(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  try {
    return validateCompatibilityCard(JSON.parse(raw));
  } catch (error) {
    genMsg("Saved card needs review and regeneration; the original is preserved. / 已保存卡片需要审核后重新生成；原始内容已保留。", false);
    return null;
  }
}
// Device card (built before any registration) + per-pseudonym copy (two-tab demo).
function saveMyCard(card) {

/* ------------------------------------------------------------------ api */
let pendingApiCalls = 0;
let vaultSwitching = false;
let vaultGeneration = null;
let vaultId = null;
function selectionChangedError() {
  return new Error("The active vault or AI changed. Reload this page before continuing; previous files are preserved. / 当前档案库或 AI 已变化。请重新加载页面后继续；原有文件已保留。");
}
async function api(path, opts = {}) {
  pendingApiCalls += 1;
  try { return await requestApi(path, opts); }
  finally { pendingApiCalls -= 1; }
}
async function requestApi(path, opts = {}) {
  const local = String(path).startsWith("/local/");
  const startedGeneration = vaultGeneration;
  if (local && startedGeneration !== null) {
    opts = {...opts, headers: {...(opts.headers || {}), "X-Slowmatch-Generation": String(startedGeneration)}};
  }
  if (String(path).includes("/matchmaking/") && state.token) {
    opts = {...opts, headers: {...(opts.headers || {}), Authorization: "Bearer " + state.token}};
  }
  const response = await fetch(path, opts);
  let body = null;
  try { body = await response.json(); } catch (_e) { /* non-JSON error page */ }
  if (vaultGeneration !== startedGeneration) throw selectionChangedError();
  if (response.status === 409 && body?.detail?.code === "local_selection_changed") {
    throw selectionChangedError();
  }
  if (response.status === 409 && body?.detail?.code === "disclosure_review_required") {
    const disclosure = await reviewDisclosure(body.detail);
    if (!disclosure) throw new Error("Sending cancelled / 已取消发送");
    const payload = JSON.parse(opts.body || "{}");
    payload.disclosure = disclosure;
    return api(path, {...opts, body: JSON.stringify(payload)});
  }
  if (!response.ok) {
    const detail = body && body.detail ? body.detail : ("HTTP " + response.status);
    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
  }
  if (local) {
    const generation = response.headers.get("X-Slowmatch-Generation");
    const nextVault = response.headers.get("X-Slowmatch-Vault");
    const selects = ["/local/vault/config", "/local/ai/config", "/local/ai/restore"].includes(path);
    if (startedGeneration !== null && !selects
        && (generation !== String(startedGeneration) || nextVault !== vaultId)) {
      throw selectionChangedError();
    }
    if (generation !== null && nextVault) {
      vaultGeneration = Number(generation);
      vaultId = nextVault;
    }
  }
  return body;
}
function post(path, payload) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
}
// Credentials travel in the Authorization header, never in URLs.
function authed(path) {
  return path;
}
function setMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.className = ok ? "ok-box" : "error-box";
  el.textContent = text;
}


function reviewDisclosure(preview) {
  return new Promise(resolve => {
    const dialog = document.createElement("dialog");
    dialog.style.cssText = "width:min(820px,90vw);max-height:90vh;border-radius:16px;padding:24px;overflow:auto";
    const title = document.createElement("h2");
    title.textContent = "Review external AI disclosure / 审核发送给外部 AI 的内容";
    const note = document.createElement("p");
    note.textContent = "Destination / 接收方: " + preview.recipient + "\n" +
      "Edit this into a minimal summary. Remove names, contact details and private facts. Only the approved messages and instructions below will be sent. Your provider may charge for use. / 请编辑为最小摘要，删除姓名、联系方式及私密事实。仅发送审核后的消息与下方指令；提供方可能收费。";
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Application instructions also sent / 同时发送的应用指令";
    const instructions = document.createElement("pre");
    instructions.style.whiteSpace = "pre-wrap";
    instructions.textContent = preview.instructions;
    details.append(summary, instructions);
    const editor = document.createElement("textarea");
    editor.setAttribute("aria-label", "Disclosure messages / 披露消息");
    editor.style.cssText = "width:100%;height:38vh;font-family:monospace;box-sizing:border-box";
    editor.value = JSON.stringify(preview.messages, null, 2);
    const error = document.createElement("p");
    error.setAttribute("role", "alert");
    const cancel = document.createElement("button"); cancel.textContent = "Cancel / 取消";
    const approve = document.createElement("button"); approve.textContent = "Approve and send / 同意并发送";
    function close(value) { dialog.close(); dialog.remove(); resolve(value); }
    cancel.onclick = () => close(null);
    dialog.addEventListener("cancel", e => { e.preventDefault(); close(null); });
    approve.onclick = () => {
      try {
        const messages = JSON.parse(editor.value);
        if (!Array.isArray(messages) || !messages.length || messages.some(m =>
          !["user", "assistant"].includes(m.role) || typeof m.content !== "string" || !m.content.trim()) ||
          messages.reduce((n,m) => n + m.content.length, 0) > 24000) {
          throw new Error("Use user/assistant messages, maximum 24,000 characters. / 仅限 user/assistant 消息，总计最多 24,000 字符。");
        }
        close({recipient:preview.recipient, instructions_hash:preview.instructions_hash, messages, reviewed:true});
      } catch(e) { error.textContent = e.message; }
    };
    dialog.append(title, note, details, editor, error, cancel, approve);
    document.body.append(dialog); dialog.showModal();
  });
}

/* ------------------------------------------------------------------ geohash (client-side only) */
const BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";
function encodeGeohash(latitude, longitude, precision) {
  precision = precision || 4;
  let latLo = -90, latHi = 90, lonLo = -180, lonHi = 180;
  const bits = [];
  let useLon = true;
  while (bits.length < precision * 5) {
    if (useLon) {
      const mid = (lonLo + lonHi) / 2;
      if (longitude >= mid) { bits.push(1); lonLo = mid; } else { bits.push(0); lonHi = mid; }
    } else {
      const mid = (latLo + latHi) / 2;
      if (latitude >= mid) { bits.push(1); latLo = mid; } else { bits.push(0); latHi = mid; }
    }
    useLon = !useLon;
  }
  let hash = "";
  for (let i = 0; i < bits.length; i += 5) {
    let value = 0;
    for (let j = i; j < i + 5; j++) value = (value << 1) | bits[j];
    hash += BASE32[value];
  }
  return hash;
}

function setBucket(latitude, longitude) {
  state.geohash = encodeGeohash(latitude, longitude, 4);
  sessionStorage.setItem("sm_geohash", state.geohash);
  renderBucket();
}
function renderBucket() {
  const el = document.getElementById("bucketDisplay");
  el.textContent = state.geohash ? t("bucketIs") + " " + state.geohash : "";
}
function useBrowserLocation() {
  if (!window.isSecureContext) { setMsg("registerMsg", t("geoInsecure"), false); return; }
  if (!navigator.geolocation) { setMsg("registerMsg", t("geoDenied"), false); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { setBucket(pos.coords.latitude, pos.coords.longitude); setMsg("registerMsg", "", true); },
    () => setMsg("registerMsg", t("geoDenied"), false),
    { enableHighAccuracy: false, timeout: 10000 }
  );
}
function useManualLocation() {
  const latitude = parseFloat(document.getElementById("lat").value);
  const longitude = parseFloat(document.getElementById("lon").value);
  if (Number.isNaN(latitude) || Number.isNaN(longitude)) { setMsg("registerMsg", t("needLocation"), false); return; }
  // Mirror the Python encoder's range checks; out-of-range input would silently
  // encode into a wrong edge bucket where no real neighbor ever appears.
  if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) {
    setMsg("registerMsg", t("badCoords"), false);
    return;
  }
  setBucket(latitude, longitude);
  setMsg("registerMsg", "", true);
}

async function refreshModelOptions(savedModel) {
  const kind = document.getElementById("aiBackend").value;
  const sel = document.getElementById("aiModelSel");
  const keep = savedModel !== undefined ? savedModel : currentModelValue();
  let models = [];
  if (state.localClient) {
    try {
      const result = await api("/local/ai/models?backend=" + encodeURIComponent(kind)
        + "&base_url=" + encodeURIComponent(
          document.getElementById("aiBaseUrl").value.trim() || "http://localhost:11434"));
      models = result.models || [];
    } catch (_e) { /* offline: default + custom still work */ }
  }
  sel.innerHTML = "";
  const add = (value, label) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    sel.appendChild(option);
  };
  add("", t("modelDefaultOpt"));
  models.forEach(name => add(name, name));
  add("__custom__", t("modelCustomOpt"));
  if (keep && models.includes(keep)) {
    sel.value = keep;
  } else if (keep) {
    sel.value = "__custom__";
    document.getElementById("aiModel").value = keep;
  } else {
    sel.value = "";
  }
  onModelSelChange();
}

async function applyVault() {
  // Obsidian model: the chosen folder owns model/notes/reports/settings.
  // Point it at a OneDrive-synced folder and every device shows the same state.
  if (!state.localClient) { setMsg("vaultMsg", t("notLocalShort"), false); return; }
  if (pendingApiCalls || vaultSwitching) {
    setMsg("vaultMsg", "Wait for the current request or review to finish before switching vaults. / 请等待当前请求或审核完成后再切换档案库。", false);
    return;
  }
  vaultSwitching = true;
  try {
    archiveVaultSession(vaultId);
    const result = await post("/local/vault/config", {
      path: document.getElementById("vaultDir").value
    });
    setMsg("vaultMsg", "✔ "
      + (result.model_saved ? t("vaultHasModel") + " · " : "")
      + (result.report_exists ? t("vaultHasReport") + " · " : "")
      + result.data_files + " " + t("dashFiles"), true);
    clearActiveVaultSession();
    sessionStorage.setItem("sm_vault_id", vaultId);
    await refreshModelOptions("");
    try {
      const stored = await api("/local/profile/load");
      if (stored.profile) {
        state.savedCard = validateCompatibilityCard(stored.profile);
        state.savedFingerprint = stored.fingerprint;
        saveMyCard(stored.profile);

    } catch (error) { genMsg(error.message, false); }
    await refreshDataList();
    await refreshDashboard();
  } catch (err) { setMsg("vaultMsg", err.message, false); }
  finally { vaultSwitching = false; }
}

function mdToHtml(md) {
  // Tiny safe markdown renderer: escape everything first, then transform
  // headings / bold / code / blockquotes / lists into styled HTML.
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", inList = false, inQuote = false;
  const closeAll = () => {
    if (inList) { html += "</ul>"; inList = false; }
    if (inQuote) { html += "</blockquote>"; inQuote = false; }
  };
  for (const raw of (md || "").split(/\r?\n/)) {
    const line = raw.trimEnd();
    const heading = line.match(/^(#{1,3})\s+(.*)/);
    if (heading) {
      closeAll();
      const level = heading[1].length;
      html += "<h" + level + ">" + inline(heading[2]) + "</h" + level + ">";
      continue;
    }
    if (/^>\s?/.test(line)) {
      if (inList) { html += "</ul>"; inList = false; }
      if (!inQuote) { html += "<blockquote>"; inQuote = true; }
      html += inline(line.replace(/^>\s?/, "")) + "<br>";
      continue;
    }
    if (/^[-*]\s+/.test(line)) {
      if (inQuote) { html += "</blockquote>"; inQuote = false; }
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inline(line.replace(/^[-*]\s+/, "")) + "</li>";
      continue;
    }
    if (!line.trim()) { closeAll(); continue; }
    closeAll();
    html += "<p>" + inline(line) + "</p>";
  }
  closeAll();
  return html;
}

/* Canonical JSON identical to reports/canonical_json.py:
   sort_keys=True, separators=(",",":"), ensure_ascii=False, top-level "signature"
   excluded. Card keys are ASCII, so JS/Python sort orders agree. */
function canonicalJson(value) {
  if (Array.isArray(value)) return "[" + value.map(canonicalJson).join(",") + "]";
  if (value !== null && typeof value === "object") {
    return "{" + Object.keys(value).sort()
      .map(key => JSON.stringify(key) + ":" + canonicalJson(value[key])).join(",") + "}";
  }
  return JSON.stringify(value);
}
async function sha256Hex(text) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function canHashLocally() { return !!(window.crypto && window.crypto.subtle); }
async function cardFingerprint(card) {
  validateCompatibilityCard(card);
  if (!canHashLocally()) throw new Error("Local hashing unavailable. Open the local app on localhost. / 本地哈希不可用，请通过 localhost 打开本地应用。");
  const unsigned = { ...card };
  delete unsigned.signature;
  return sha256Hex(canonicalJson(unsigned));
}

function resolveLocation() {
  const locatingGeneration = vaultGeneration;
  return new Promise(resolve => {
    if (state.geohash) { resolve(true); return; }
    if (window.isSecureContext && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => {
          if (vaultGeneration !== locatingGeneration) { resolve(false); return; }
          setBucket(pos.coords.latitude, pos.coords.longitude); resolve(true);
        },
        () => resolve(false),
        { enableHighAccuracy: false, timeout: 10000 }
      );
    } else { resolve(false); }
  });
}

async function startMatching() {
  const matchingGeneration = vaultGeneration;
  const identity = loadIdentity();
  const age = intOrNull("age");
  if (!Number.isInteger(age) || age < 18 || age > 120) {
    setMsg("registerMsg", "Enter an adult age (18–120). / 请填写成年年龄（18–120）。", false); return;
  }
  if (!state.savedCard) { setMsg("registerMsg", t("needModel"), false); refreshMatchGates(); return; }
  if (!identity.contact || !identity.consent) {
    setMsg("registerMsg", t("matchNeedSetup"), false);
    refreshMatchGates();
    return;
  }
  if (!(await resolveLocation())) {
    setMsg("registerMsg", t("geoDenied") + " " + t("matchNeedSetup"), false);
    return;
  }
  if (vaultGeneration !== matchingGeneration) return;
  if (!identity.pseudonym) {
    identity.pseudonym = randomPseudonym();
    document.getElementById("pseudonym").value = identity.pseudonym;
    localStorage.setItem("sm_identity", JSON.stringify(identity));
  }
  if (!state.registered) {
    const seeking = document.getElementById("seekEveryone").checked
      ? null
      : Array.from(document.querySelectorAll(".seekGender:checked")).map(cb => cb.value);
    try {
      const result = await post(mm("/matchmaking/register"), {
        pseudonym: identity.pseudonym,
        geohash: state.geohash,
        contact: identity.contact,
        consent_confirmed: true,
        age: intOrNull("age"),
        seeking_age_min: intOrNull("seekAgeMin"),
        seeking_age_max: intOrNull("seekAgeMax"),
        gender: document.getElementById("gender").value || null,
        seeking_genders: seeking && seeking.length ? seeking : null
      });
      enterRegistered(identity.pseudonym, result.token);
      logEvent(t("registered") + " " + identity.pseudonym);
      await autoAttest();
    } catch (err) {
      if (/already registered/i.test(err.message) || /已注册/.test(err.message)) {
        const ownToken = sessionStorage.getItem("sm_pseudonym") === identity.pseudonym
          ? sessionStorage.getItem("sm_token") : null;
        if (ownToken) { enterRegistered(identity.pseudonym, ownToken); await autoAttest(); }
        else { setMsg("registerMsg", t("alreadyRegistered"), false); return; }
      } else { setMsg("registerMsg", err.message, false); return; }
    }
  }
  if (!state.attested) { setMsg("registerMsg", t("needModel"), false); return; }
  setMsg("registerMsg", "", true);
  state.introduced = new Set(loadMatchLog().filter(e => e.kind === "intro").map(e => e.who));
  if (state.matchTimer) clearInterval(state.matchTimer);
  state.matchTimer = setInterval(matchTick, 12000);
  logEvent(t("matchingStarted"));
  refreshMatchGates();
  matchTick();
}

function stopMatching() {
  if (state.matchTimer) clearInterval(state.matchTimer);
  state.matchTimer = null;
  logEvent(t("matchingStopped"));
  refreshMatchGates();
}

async function matchTick() {
  // Auto-discovery + auto-introductions. Accepting stays a human decision.
  if (!state.registered || !state.attested) return;
  const precision = document.getElementById("distanceSel").value;
  try {
    const result = await api(mm(authed("/matchmaking/nearby/" + encodeURIComponent(state.pseudonym)))
      + "&precision=" + precision);
    for (const candidate of result.candidates) {
      if (state.introduced.has(candidate.pseudonym)) continue;
      state.introduced.add(candidate.pseudonym);
      try {
        await post(mm("/matchmaking/introduce"), {
          initiator: state.pseudonym, token: state.token, recipient: candidate.pseudonym
        });
        const log = loadMatchLog();
        log.unshift({ time: new Date().toTimeString().slice(0, 8),
          text: t("introSentTo") + " " + candidate.pseudonym, kind: "intro", who: candidate.pseudonym });
        sessionStorage.setItem("sm_matchlog", JSON.stringify(log.slice(0, 50)));
        renderLog();
      } catch (_err) { /* pair already live/declined; server enforces the rules */ }
    }
  } catch (err) {
    if (/Unknown pseudonym/i.test(err.message)) { stopMatching(); resetSession(t("sessionLost")); }
  }
}

async function refreshInbox() {
  if (!state.registered) return;
  const seq = ++state.inboxSeq;  // drop out-of-order responses (poller vs post-respond)
  try {
    const result = await api(mm(authed("/matchmaking/introductions/" + encodeURIComponent(state.pseudonym))));
    if (seq !== state.inboxSeq || !state.registered) return;  // a newer request superseded this one
    const json = JSON.stringify(result.introductions);
    if (json === state.lastInboxJson) return;  // unchanged: don't wipe DOM mid-click
    state.lastInboxJson = json;
    state.lastInbox = result.introductions;
    renderInbox(result.introductions);
  } catch (err) {
    // In-memory node restarted or this pseudonym was deleted: stale Accept/Match
    // buttons would only ever error. Reset honestly instead of pretending.
    if (/Unknown pseudonym/i.test(err.message)) resetSession(t("sessionLost"));
  }
}

      acceptBtn.onclick = () => respond(entry.introduction_id, true);
      const declineBtn = document.createElement("button");
      declineBtn.className = "ghost small"; declineBtn.style.marginLeft = "6px";
      declineBtn.textContent = t("decline");
      declineBtn.onclick = () => respond(entry.introduction_id, false);
      right.appendChild(acceptBtn); right.appendChild(declineBtn);
    }
    if (entry.direction === "sent" && entry.status === "pending") {
      // Initiator taking back their own request — server treats it as a
      // withdrawal, not a decline, so the pair is not poisoned.
      const withdrawBtn = document.createElement("button");
      withdrawBtn.className = "ghost small"; withdrawBtn.style.marginLeft = "8px";
      withdrawBtn.textContent = t("withdraw");
      withdrawBtn.onclick = () => respond(entry.introduction_id, false);
      right.appendChild(withdrawBtn);
    }
    if (entry.status === "matched") {
      const openBtn = document.createElement("button");
      openBtn.className = "ghost small"; openBtn.style.marginLeft = "8px";
      openBtn.textContent = t("openMatch");
      openBtn.onclick = () => openMatch(entry.introduction_id);
      right.appendChild(openBtn);
    }
    row.appendChild(right);
    list.appendChild(row);
  });
}

async function respond(introductionId, accept) {
  try {
    const result = await post(mm("/matchmaking/respond"), {
      pseudonym: state.pseudonym, token: state.token,
      introduction_id: introductionId, accept: accept
    });
    const entry = (state.lastInbox || []).find(e => e.introduction_id === introductionId);
    const who = entry ? entry.counterpart_pseudonym : "";
    if (result.status === "matched") logEvent(t("statusMatched") + " · " + who);
    else if (result.status === "declined") logEvent(t("statusDeclined") + " · " + who);
    state.lastInboxJson = "";  // force a re-render with the new status
    refreshInbox();
    if (result.status === "matched") openMatch(introductionId);
  } catch (err) { setMsg("introMsg", err.message, false); }
}

/* ------------------------------------------------------------------ step 5: match */
async function openMatch(introductionId) {
  try {
    const packet = await api(mm(authed(
      "/matchmaking/match/" + encodeURIComponent(introductionId) + "/" + encodeURIComponent(state.pseudonym)
    )));
    state.activeMatchIntro = introductionId;
    state.activeMatchPacket = packet;
    const section = document.getElementById("stepMatch");
    section.classList.remove("hidden");
    const box = document.getElementById("matchPacket");
    box.innerHTML = "";
    const name = document.createElement("p");
    name.innerHTML = "<b></b>";
    name.querySelector("b").textContent = packet.counterpart_pseudonym;
    box.appendChild(name);
    const contact = document.createElement("p");
    contact.textContent = t("contactIs") + " " + packet.counterpart_contact;
    box.appendChild(contact);
    const fp = document.createElement("p");
    fp.className = "mono";
    fp.textContent = t("lockedFp") + " " + packet.locked_fingerprint;
    box.appendChild(fp);
    const how = document.createElement("p");
    how.className = "fine";
    how.textContent = t("howVerify");
    box.appendChild(how);
    section.scrollIntoView({ behavior: "smooth" });
  } catch (err) { setMsg("introMsg", err.message, false); }
}

function exportMyCard() {
  const card = loadMyCard();
  if (!card) { setMsg("verifyMsg", t("noMyCard"), false); return; }
  try { validateCompatibilityCard(card); }
  catch (error) { setMsg("verifyMsg", error.message, false); return; }
  const text = JSON.stringify(card, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "compatibility-card-" + state.pseudonym + ".json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);  // don't yank the URL mid-download
  copyText(text, "verifyMsg");
}

async function verifyTheirCard() {
  if (!state.activeMatchIntro) return;
  let theirCard;
  try {
    theirCard = JSON.parse(document.getElementById("theirCardInput").value);
  } catch (_e) { setMsg("verifyMsg", t("invalidJson"), false); return; }
  try {
    let valid;
    if (canHashLocally() && state.activeMatchPacket) {
      // Preferred: sha256(canonical card) compared to the locked fingerprint,
      // entirely on this device — their card content never goes to the server.
      valid = (await cardFingerprint(theirCard)) === state.activeMatchPacket.locked_fingerprint;
    } else {
      const result = await post(mm("/matchmaking/verify-card"), {
        pseudonym: state.pseudonym, token: state.token,
        introduction_id: state.activeMatchIntro,
        fingerprint: await cardFingerprint(theirCard)
      });
      valid = result.valid;
    }
    if (valid) {
      setMsg("verifyMsg", t("verifyOk"), true);
      logEvent(t("verifyOk"));
      renderComparison(theirCard);
      aiReflection(theirCard);
    } else {
      setMsg("verifyMsg", t("verifyBad"), false);
      logEvent(t("verifyBad"));
      document.getElementById("comparison").innerHTML = "";
    }
  } catch (err) { setMsg("verifyMsg", err.message, false); }
}

async function aiReflection(theirCard) {
  // The person confirms purpose-specific consent before model analysis.
  if (!state.localClient || !state.aiName) return;
  if (!confirm("Have both people explicitly agreed to this AI comparison? / 双方是否都明确同意此次 AI 比较？")) return;
  const box = document.getElementById("comparison");
  const holder = document.createElement("div");
  holder.className = "notice";
  holder.textContent = t("reflecting");
  box.insertBefore(holder, box.firstChild);
  try {
    const result = await post("/local/ai/compare", {
      their_card: theirCard, counterpart_consent_confirmed: true,
      language: lang === "zh" ? "Simplified Chinese" : "English"
    });
    holder.innerHTML = "";
    const title = document.createElement("b");
    title.textContent = t("aiReflectionTitle") + " (" + result.backend + ")";
    holder.appendChild(title);
    const body = document.createElement("p");
    body.style.whiteSpace = "pre-wrap";
    body.textContent = result.reflection;
    holder.appendChild(body);
  } catch (err) {
    holder.textContent = t("aiReflectionTitle") + ": " + err.message;
  }
}

/* ---------------------------------------------- local, non-scoring comparison */
function renderComparison(theirCard) {
  validateCompatibilityCard(theirCard);
  const myCard = loadMyCard();
  const box = document.getElementById("comparison");
  box.innerHTML = "";
  if (!myCard) { box.textContent = t("noMyCard"); return; }

  const title = document.createElement("h2");
  title.textContent = t("comparisonTitle");
  title.style.marginTop = "18px";
  box.appendChild(title);

  const mine = myCard.tier2_summary || {};
  const theirs = theirCard.tier2_summary || {};
  const myValues = (mine.values || []).map(v => String(v).toLowerCase());
  const theirValues = (theirs.values || []).map(v => String(v).toLowerCase());
  const shared = myValues.filter(v => theirValues.includes(v));
  const onlyOne = myValues.filter(v => !theirValues.includes(v))
    .concat(theirValues.filter(v => !myValues.includes(v)));

  const sharedP = document.createElement("p");
  sharedP.innerHTML = "<b>" + t("sharedValues") + ":</b> ";
  sharedP.appendChild(document.createTextNode(shared.length ? shared.join(", ") : "—"));
  box.appendChild(sharedP);
  const diffP = document.createElement("p");
  diffP.innerHTML = "<b>" + t("differentValues") + ":</b> ";
  diffP.appendChild(document.createTextNode(onlyOne.length ? onlyOne.join(", ") : "—"));
  box.appendChild(diffP);

  const grid = document.createElement("div");
  grid.className = "compare-grid";
  [["myCol", mine], ["theirCol", theirs]].forEach(([colKey, summary]) => {
    const col = document.createElement("div");
    col.className = "col";
    const h = document.createElement("h4");
    h.textContent = t(colKey);
    col.appendChild(h);
    [["goals", "life_goals"], ["comm", "communication_style"],
     ["boundaries", "boundaries"], ["uncertainty", "uncertainty_notes"]].forEach(([labelKey, field]) => {
      const p = document.createElement("p");
      p.className = "fine";
      p.innerHTML = "<b>" + t(labelKey) + ":</b> ";
      p.appendChild(document.createTextNode(summary[field] || "—"));
      col.appendChild(p);
    });
    grid.appendChild(col);
  });
  box.appendChild(grid);

  const talkTitle = document.createElement("p");
  talkTitle.innerHTML = "<b>" + t("talkAbout") + ":</b>";
  box.appendChild(talkTitle);
  const ul = document.createElement("ul");
  ul.className = "plain";
  t("talkPrompts").forEach(promptText => {
    const li = document.createElement("li");
    li.textContent = promptText;
    ul.appendChild(li);
  });
  box.appendChild(ul);

  const copyBtn = document.createElement("button");
  copyBtn.className = "ghost small";
  copyBtn.textContent = t("copyCompare");
  copyBtn.onclick = () => {
    const promptText = t("comparePrompt")
      .replace("{A}", JSON.stringify(myCard, null, 2))
      .replace("{B}", JSON.stringify(theirCard, null, 2));
    copyText(promptText, "verifyMsg");
  };
  box.appendChild(copyBtn);
}

/* ------------------------------------------------------------------ delete */
async function deleteMe() {
  try {
    await api(mm(authed("/matchmaking/register/" + encodeURIComponent(state.pseudonym))),
      { method: "DELETE" });
    resetSession(null);  // fully re-lock the UI; no half-alive buttons left behind
    setMsg("deleteMsg", t("deleted"), true);
  } catch (err) { setMsg("deleteMsg", err.message, false); }
}

/* ------------------------------------------------------------------ util */
function copyText(text, msgId) {
  const finish = () => setMsg(msgId, t("copied"), true);
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(finish, () => fallbackCopy(text, finish));
  } else {
    fallbackCopy(text, finish);
  }
}
function fallbackCopy(text, done) {
  const area = document.createElement("textarea");
  area.value = text;
  area.style.position = "fixed"; area.style.opacity = "0";
  document.body.appendChild(area);
  area.select();
  try { document.execCommand("copy"); } catch (_e) { /* best effort */ }
  document.body.removeChild(area);
  done();
}

/* ------------------------------------------------------------------ boot */
applyI18n();
onBackendChange();
document.getElementById("nodeUrl").value = state.nodeUrl;

// First run -> setup wizard; afterwards -> last view (or Home).
if (!localStorage.getItem("sm_setup_done")) {
  document.getElementById("setupWizard").classList.remove("hidden");
} else {
  showView(sessionStorage.getItem("sm_view") || "home");
}

// Detect the packaged local app: /local/* exists only there. On a plain node,
// connected-AI features degrade to the manual + copy-prompt path.
(async () => {
  try {
    const status = await api("/local/status");
    state.localClient = !!status.local_client;
    const previousVault = sessionStorage.getItem("sm_vault_id");
    if (state.localClient && previousVault !== vaultId) {
      archiveVaultSession(previousVault);
      clearActiveVaultSession();
    }
    if (state.localClient) sessionStorage.setItem("sm_vault_id", vaultId);
    if (state.localClient) {
      const identity = loadIdentity();
      document.getElementById("pseudonym").value = identity.pseudonym || "";
      document.getElementById("contact").value = identity.contact || "";
      document.getElementById("consent").checked = !!identity.consent;
    }
    // Prefill Settings > AI from the persisted (non-secret) choice.
    const saved = status.settings || {};
    if (saved.backend && !["codex", "gemini"].includes(saved.backend)) {
      document.getElementById("aiBackend").value = saved.backend;
      if (saved.base_url) document.getElementById("aiBaseUrl").value = saved.base_url;
      onBackendChange();
      // Re-populate the dropdown with the persisted choice once localClient is
      // known (onBackendChange's fetch may have raced the status probe).
      await refreshModelOptions(saved.model || "");
    }
    if (saved.data_dir) document.getElementById("dataDir").value = saved.data_dir;
    if (status.vault_dir) document.getElementById("vaultDir").value = status.vault_dir;
  } catch (_e) {
    state.localClient = false;
  }
  if (state.localClient) {
    try {
      // Reconnect the persisted backend (keyless kinds only; Anthropic re-asks).
      const restored = await post("/local/ai/restore", {});
      if (restored.restored) {
        state.aiName = restored.backend;
        setMsg("aiMsg", "✔ " + t("chatUsing") + " " + restored.backend, true);
      }
    } catch (_e) { /* backend not reachable right now */ }
    try {
      const stored = await api("/local/profile/load");
      if (stored.profile) {
        state.savedCard = validateCompatibilityCard(stored.profile);
        state.savedFingerprint = stored.fingerprint;
        if (!loadMyCard()) saveMyCard(stored.profile);
      }
    } catch (error) { genMsg(error.message, false); }
  } else {
    document.getElementById("notLocalNotice").classList.remove("hidden");
    document.getElementById("aiControls").classList.add("hidden");
    document.querySelector("button[onclick='testAI()']").classList.add("hidden");
    document.getElementById("chatgptZip").classList.add("hidden");
    // Restore a locally kept card so matching still works against a node.
    const device = loadMyCard();
    if (device) {
      state.savedCard = device;
      if (canHashLocally()) {
        cardFingerprint(device).then(fp => { state.savedFingerprint = fp; renderReport(); });
      }
    }
  }
  refreshDashboard();
})();

// Restore matching identity (pseudonym/contact/consent live in Settings > Matching).
const identity = loadIdentity();
if (identity.pseudonym) document.getElementById("pseudonym").value = identity.pseudonym;
if (identity.contact) document.getElementById("contact").value = identity.contact;
document.getElementById("consent").checked = !!identity.consent;

if (micSupported()) document.getElementById("micBtn").classList.remove("hidden");

if (state.registered && state.pseudonym && state.token) {
  enterRegistered(state.pseudonym, state.token);
} else if (state.registered) {
  // Stale flags without a token (e.g. cleared mid-session): start clean.
  resetSession(null);
}
updateSourceCount();
renderChat();
refreshMatchGates();
</script>
