name: build-apps

# Remote compute is explicitly started by a human. Local release is automatic per command.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target / 构建目标"
        required: true
        default: work-preview
        type: choice
        options:
          - work-preview
          - legacy-desktop

jobs:
  windows-work-preview:
    if: inputs.target == 'work-preview'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: pip install -c packaging/constraints-windows-py312.txt ".[dev]" pyinstaller
      - shell: pwsh
        run: |
          $releaseOutput = "$env:LOCALAPPDATA/AI-SlowMatch/ci-work-release"
          "WORK_RELEASE=$releaseOutput" >> $env:GITHUB_ENV
          python scripts/work_distribution_build.py --output "$releaseOutput"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-SlowMatch-Work-controlled-preview
          path: |
            ${{ env.WORK_RELEASE }}/*.zip
            ${{ env.WORK_RELEASE }}/SHA256SUMS.txt
          if-no-files-found: error
  windows-desktop:
    if: inputs.target == 'legacy-desktop'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c packaging/constraints-windows-py312.txt ".[desktop,dev]" pyinstaller
      - run: python scripts/release_manager.py build
      - uses: actions/upload-artifact@v4
        with:
          name: AI-SlowMatch-desktop
          path: |
            AI-SlowMatch.exe
            releases/current.json
            releases/*/manifest.json
          if-no-files-found: error
