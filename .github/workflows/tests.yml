name: tests

# Manual remote execution; local release runs the same gates automatically.
on: [workflow_dispatch]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ADS_NO_AUTOCONNECT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev,desktop]"
      - run: python -m compileall -q src apps
      - run: python -m pytest -q
      - run: python -m ruff check src apps tests scripts
      - run: python packaging/smoke_install.py
